version: 2.1

jobs:
  job_one:
    docker:
      - image: cimg/ruby:3.2.2
    steps:
      - checkout  # Checkout the code (pulls your project repository)
      - run:
          name: "Create files and directories"
          command: |
            # Create a directory named 'my_workspace'
            mkdir -p my_workspace
            # Create a file 'echo-output' with some content
            echo "This is a test file created in job_one" > my_workspace/echo-output
            # List the files to confirm they exist
            ls -R my_workspace
      - persist_to_workspace:
          root: .  # The current directory, where files will be persisted from
          paths:
            - my_workspace  # Persist the 'my_workspace' directory

  job_two:
    docker:
      - image: cimg/ruby:3.2.2  # Same image as job_one
    steps:
      - checkout  # Checkout the code
      - attach_workspace:
          at: /workspace  # Attach the workspace at '/workspace'
      - run:
          name: "Verify contents of attached workspace"
          command: |
            # Debugging step to see if the workspace is attached
            echo "Listing contents of /workspace"
            ls -R /workspace  # List the contents of the attached workspace
            # Check if the file exists and contains the expected content
            if [ -f /workspace/my_workspace/echo-output ]; then
              echo "The file exists and the content is:"
              cat /workspace/my_workspace/echo-output
            else
              echo "File not found!" && exit 1
            fi
            # Check if the content matches what was written in job_one
            if [ "$(cat /workspace/my_workspace/echo-output)" = "This is a test file created in job_one" ]; then
              echo "It worked"
            else
              echo "It failed" && exit 1
            fi

workflows:
  version: 2
  build:
    jobs:
      - job_one
      - job_two:
          requires:
            - job_one  # Ensure job_two runs after job_one
