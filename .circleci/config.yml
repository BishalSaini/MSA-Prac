version: 2.1

jobs:
  job_one:
    docker:
      - image: cimg/ruby:2.6.8  # Ruby Docker image 2.6.8
    steps:
      - checkout  # Checkout the code
      - run:
          name: "Echo Hello World"
          command: echo "First Hello World... by Vishu"
      - run:
          name: "Sleep"
          command: sleep 25

  job_two:
    docker:
      - image: cimg/ruby:3.8.2  # Ruby Docker image 3.8.2
    steps:
      - checkout  # Checkout the code
      - run:
          name: "Echo Hello World"
          command: echo "Second Hello World... by Vishu"

workflows:
  version: 2
  build:
    jobs:
      - job_one
      - job_two
