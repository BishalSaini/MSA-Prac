version: 2.1

jobs:
  job_one:
    docker:
      - image: cimg/ruby:2.6.8
    steps:
      - checkout
      - run:
          name: "Create Workspace Directory"
          command: |
            mkdir -p workspace
            echo "This is data from job_one" > workspace/workspace_file.txt
      - run:
          name: "Verify Workspace Directory and File"
          command: |
            ls -l workspace
            cat workspace/workspace_file.txt
      - persist_to_workspace:
          root: workspace
          paths:
            - workspace_file.txt

  job_two:
    docker:
      - image: cimg/ruby:3.2
    steps:
      - attach_workspace:
          at: /workspace
      - run:
          name: "Verify Attached Workspace"
          command: |
            ls -l /workspace
            cat /workspace/workspace_file.txt
      - run:
          name: "Echo Workspace Content"
          command: echo "Successfully read: $(cat /workspace/workspace_file.txt)"

workflows:
  version: 2
  build:
    jobs:
      - job_one
      - job_two:
          requires:
            - job_one
