version: 2.1

jobs:
  job_one:
    docker:
      - image: cimg/ruby:3.2.2
    steps:
      - checkout  # Checkout the code
      - run:
          name: "Create files and directories"
          command: |
            mkdir -p /tmp/my_workspace  # Create the directory in /tmp (absolute path)
            echo "This is a test file created in job_one" > /tmp/my_workspace/echo-output  # Create the test file
            ls -R /tmp/my_workspace  # List the contents to confirm the file is there
      - persist_to_workspace:
          root: /tmp  # Set the workspace root to /tmp directory
          paths:
            - my_workspace  # Persist the 'my_workspace' directory

  job_two:
    docker:
      - image: cimg/ruby:3.2.2
    steps:
      - checkout  # Checkout the code
      - attach_workspace:
          at: /workspace  # Attach the workspace to /workspace directory
      - run:
          name: "Verify workspace contents"
          command: |
            ls -R /workspace  # List all files in the attached workspace
            # Check if the 'echo-output' file exists and contains the correct content
            if [ -f /workspace/my_workspace/echo-output ]; then
              echo "File found: Contents are:"
              cat /workspace/my_workspace/echo-output  # Display file contents
            else
              echo "File not found!" && exit 1  # If file not found, exit with an error
            fi

workflows:
  version: 2
  build:
    jobs:
      - job_one
      - job_two:
          requires:
            - job_one  # Ensure job_two runs after job_one
