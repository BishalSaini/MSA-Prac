version: 2.1

jobs:
  job_one:
    docker:
      - image: cimg/ruby:3.2.2
    steps:
      - checkout  # Checkout the code
      - run:
          name: "Create files and directories"
          command: |
            mkdir -p /tmp/my_workspace
            echo "This is a test file created in job_one" > /tmp/my_workspace/echo-output
            ls -R /tmp/my_workspace
      - save_cache:
          key: my_workspace-cache
          paths:
            - /tmp/my_workspace

  job_two:
    docker:
      - image: cimg/ruby:3.2.2
    steps:
      - checkout  # Checkout the code
      - restore_cache:
          keys:
            - my_workspace-cache
      - run:
          name: "Verify workspace contents"
          command: |
            ls -R /tmp/my_workspace  # List all files in the restored cache
            if [ -f /tmp/my_workspace/echo-output ]; then
              echo "File found: Contents are:"
              cat /tmp/my_workspace/echo-output
            else
              echo "File not found!" && exit 1
            fi

workflows:
  version: 2
  build:
    jobs:
      - job_one
      - job_two:
          requires:
            - job_one
