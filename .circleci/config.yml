version: 2.1

jobs:
  job_one:
    docker:
      - image: cimg/ruby:3.2.2  # Ruby version for consistency
    steps:
      - checkout  # Checkout the code from your repository
      - run:
          name: "Create workspace and file"
          command: |
            # Create a directory within the workspace
            mkdir -p my_workspace
            echo "Trying out workspaces" > my_workspace/echo-output
      - persist_to_workspace:
          root: .  # Use the current directory as the root
          paths:
            - my_workspace  # Persist the entire directory

  job_two:
    docker:
      - image: cimg/ruby:3.2.2  # Ruby version for consistency
    steps:
      - checkout  # Checkout the code from your repository
      - attach_workspace:
          at: /workspace  # Attach the workspace to the /workspace directory
      - run:
          name: "Check if workspace content is available"
          command: |
            # Ensure the directory exists
            mkdir -p /workspace/my_workspace
            ls -R /workspace  # Debugging step to verify workspace structure
            # Verify the content of the file from job_one
            if [ "$(cat /workspace/my_workspace/echo-output)" = "Trying out workspaces" ]; then
              echo "It worked"
            else
              echo "It failed" && exit 1
            fi

workflows:
  version: 2
  build:
    jobs:
      - job_one
      - job_two:
          requires:
            - job_one  # Ensure job_two runs after job_one
