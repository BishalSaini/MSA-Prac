version: 2.1

jobs:
  job_one:
    docker:
      - image: cimg/ruby:3.2.2  # Use a valid Ruby version
    steps:
      - checkout
      - run:
          name: "Echo first hello"
          command: echo "A first hello"
      - run:
          name: "Create workspace and file"
          command: |
            mkdir -p my_workspace
            echo "Trying out workspaces" > my_workspace/echo-output
      - persist_to_workspace:
          root: my_workspace
          paths:
            - echo-output

  job_two:
    docker:
      - image: cimg/ruby:3.2.2  # Use the same valid Ruby version
    steps:
      - checkout
      - attach_workspace:
          at: /workspace
      - run:
          name: "Check if workspace content is available"
          command: |
            if [ "$(cat /workspace/my_workspace/echo-output)" = "Trying out workspaces" ]; then
              echo "It worked"
            else
              echo "It failed" && exit 1
            fi

workflows:
  version: 2
  build:
    jobs:
      - job_one
      - job_two:
          requires:
            - job_one
